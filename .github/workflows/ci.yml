name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: lint-test-build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root_test, MYSQL_USER: capfootball, MYSQL_PASSWORD: test, MYSQL_DATABASE: capfootball_test }
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -proot_test --silent" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: mysql://capfootball:test@localhost:3306/capfootball_test
      AUTH_SECRET: ci-only-secret-never-use-in-production-123456
      AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.2 }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec prisma validate
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
  e2e:
    name: public-e2e
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root_test, MYSQL_USER: capfootball, MYSQL_PASSWORD: test, MYSQL_DATABASE: capfootball_e2e }
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -proot_test --silent" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: mysql://capfootball:test@localhost:3306/capfootball_e2e
      AUTH_SECRET: ci-only-secret-never-use-in-production-123456
      AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.2 }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:generate && pnpm db:deploy && pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
