name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/home/ubuntu/devops/capfootball' }}
          DEPLOY_SHA: ${{ github.sha }}
          PUBLIC_VAPID_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          envs: DEPLOY_PATH,DEPLOY_SHA,PUBLIC_VAPID_KEY
          script: |
            set -eu
            cd "$DEPLOY_PATH"

            echo "Pull latest code..."
            git pull --ff-only origin main
            if [ "$(git rev-parse HEAD)" != "$DEPLOY_SHA" ]; then
              echo "main has changed. Run deployment for its latest commit." >&2
              exit 1
            fi
            test -s .env || { echo "Missing .env on VPS." >&2; exit 1; }
            APP_IMAGE="capfootball:$DEPLOY_SHA"
            ENV_MOUNT="type=bind,src=$(pwd)/.env,dst=/run/capfootball.env,readonly"

            # Parse quoted .env values without printing or changing the original file.
            umask 077
            ENV_FILE=$(mktemp)
            trap 'rm -f "$ENV_FILE"' EXIT
            docker run --rm --user 0:0 --mount "$ENV_MOUNT" node:22-bookworm-slim node -e '
              const { readFileSync } = require("node:fs");
              const values = require("node:util").parseEnv(readFileSync("/run/capfootball.env", "utf8"));
              for (const value of Object.values(values)) {
                if (/[\r\n\0]/.test(value)) throw new Error("Environment values must be single-line.");
              }
              for (const [key, value] of Object.entries(values)) process.stdout.write(key + "=" + value + "\n");
            ' > "$ENV_FILE"

            env_value() { sed -n "s/^$1=//p" "$ENV_FILE"; }
            WEB_PORT=$(env_value PORT)
            WEB_PORT=${WEB_PORT:-3019}
            case "$WEB_PORT" in
              *[!0-9]*) echo "PORT must be a number between 1 and 65535." >&2; exit 1 ;;
            esac
            if [ "${#WEB_PORT}" -gt 5 ] || [ "$WEB_PORT" -lt 1 ] || [ "$WEB_PORT" -gt 65535 ]; then
              echo "PORT must be a number between 1 and 65535." >&2
              exit 1
            fi
            for key in PUSHER_APP_ID NEXT_PUBLIC_PUSHER_KEY PUSHER_SECRET; do
              if [ -z "$(env_value "$key")" ]; then
                echo "Missing $key in VPS .env." >&2
                exit 1
              fi
            done
            PUBLIC_VAPID_KEY=${PUBLIC_VAPID_KEY:-$(env_value NEXT_PUBLIC_VAPID_PUBLIC_KEY)}
            PUBLIC_PUSHER_KEY=$(env_value NEXT_PUBLIC_PUSHER_KEY)
            PUBLIC_PUSHER_CLUSTER=$(env_value NEXT_PUBLIC_PUSHER_CLUSTER)

            echo "Build new image using the existing configuration..."
            docker build \
              --build-arg "NEXT_PUBLIC_PUSHER_KEY=$PUBLIC_PUSHER_KEY" \
              --build-arg "NEXT_PUBLIC_PUSHER_CLUSTER=${PUBLIC_PUSHER_CLUSTER:-ap1}" \
              --build-arg "NEXT_PUBLIC_VAPID_PUBLIC_KEY=$PUBLIC_VAPID_KEY" \
              -t "$APP_IMAGE" .

            echo "Replace web container..."
            # Remove the legacy realtime container when updating an existing deployment.
            docker rm -f capfootball-app-1 capfootball-realtime-1 >/dev/null 2>&1 || true
            docker run -d \
              --name capfootball-app-1 \
              --restart unless-stopped \
              --publish "$WEB_PORT:3019" \
              --env-file "$ENV_FILE" \
              --env PORT=3019 \
              --env HOSTNAME=0.0.0.0 \
              "$APP_IMAGE" \
              node .next/standalone/server.js
            echo "Check web..."
            attempt=0
            check_health() {
              docker exec capfootball-app-1 node -e "fetch('http://127.0.0.1:3019/api/health',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" || return 1
            }
            until check_health; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 24 ]; then
                echo "Deployment health check failed." >&2
                exit 1
              fi
              sleep 5
            done

            echo "Deploy success! Web port: $WEB_PORT. Realtime: Pusher."
